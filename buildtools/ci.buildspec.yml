version: 0.2

phases:
  install:
    runtime-versions:
      dotnet: 10.x
    commands:
      # Find and delete the global.json files that were added by CodeBuild. This causes issues when multiple SDKs are installed.
      - find / -type f -name 'global.json' -delete
      # Install the latest .NET 10 SDK manually.
      - curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0
      # Install Mono so the net472 target of AWS.Extensions.Bedrock.MEAI(.UnitTests) can execute on Linux.
      - apt-get update && apt-get install -y mono-complete

  build:
    commands:
      - dotnet build AWS.DotNetAI.slnx -c Release
      - dotnet test AWS.DotNetAI.slnx -c Release --no-build --logger trx --logger "console;verbosity=detailed" --results-directory ./testresults
reports:
  aws-dotnet-ai-tests:
    file-format: VisualStudioTrx
    files:
      - "**/*"
    base-directory: "./testresults"
